name: Upstream Sync (manual only)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run action in test mode"
        required: false
        default: "false"

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: huilang-me/CF-Server-Monitor
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          sync_test_mode: ${{ inputs.test_mode }}

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] Auto cron retired; use daily-upstream-sync workflow or manual PR."
          exit 1
