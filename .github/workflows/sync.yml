name: Upstream Sync (deprecated)

# DEPRECATED 2026-08-29:
# - The original aormsby/Fork-Sync-With-Upstream-action cron pushed directly to
#   main, which clobbered our site-identity overlay (wrangler.toml + D1 id).
# - Replacement: .github/workflows/daily-upstream-sync.yml runs at 00:00 UTC,
#   fetches upstream, opens a draft PR when there are changes, never pushes to
#   main directly. Manual merge after review.
# - This file is kept as a deprecation tombstone so anyone landing here from a
#   web search or older runbook sees the message instead of a working-but-dangerous
#   cron. It also overrides upstream's sync.yml via .gitattributes `merge=ours`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Notice only
    runs-on: ubuntu-latest
    steps:
      - name: This workflow is retired
        run: |
          echo "[DEPRECATED] Use daily-upstream-sync instead."
          echo "  - Auto: 00:00 UTC cron in .github/workflows/daily-upstream-sync.yml"
          echo "  - Manual: gh workflow run daily-upstream-sync.yml -R tdcasual/CF-Server-Monitor"
