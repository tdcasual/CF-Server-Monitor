name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Verify wrangler.toml
        run: |
          set -euo pipefail
          test -f wrangler.toml
          grep -q 'name = "server-monitor-pro"' wrangler.toml
          grep -q 'custom_domain = true' wrangler.toml
          grep -q 'server-monitor-db' wrangler.toml
          grep -q 'crons' wrangler.toml
          echo "wrangler.toml ok"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Note secrets stay local
        run: |
          echo "Worker secrets (API_SECRET / API_USER_NAME / CORS_ALLOWED_ORIGINS) are not put in CI."
          echo "Update them with: wrangler secret put NAME --name server-monitor-pro"
