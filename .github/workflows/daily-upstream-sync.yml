name: Daily Upstream Sync

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check and report, do not push or open PR"
        required: false
        default: "false"

jobs:
  sync_upstream:
    name: Open PR for upstream changes
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git

      - name: Fetch upstream
        run: git fetch --quiet upstream main

      - name: Configure git
        run: |
          git config user.name "ops-assistant"
          git config user.email "ops-assistant@tdcasual.local"

      - name: Create sync branch
        run: |
          DATE=$(date -u +%Y%m%d)
          BRANCH="sync/upstream-${DATE}"
          echo "BRANCH=${BRANCH}" >> $GITHUB_OUTPUT
          git checkout -B "${BRANCH}" fork/main
        id: branch

      - name: Merge upstream
        id: merge
        run: |
          set -e
          if git merge --no-edit upstream/main; then
            echo "MERGE_STATUS=clean" >> $GITHUB_OUTPUT
          else
            echo "MERGE_STATUS=conflict" >> $GITHUB_OUTPUT
            echo "Conflicts:"
            git ls-files -u
            # abort so we can still create a PR for human review
            git merge --abort || true
          fi

      - name: Check overlay files
        id: overlay
        run: |
          set -e
          if [ "${{ steps.merge.outputs.MERGE_STATUS }}" != "clean" ]; then
            echo "OVERLAY_DIRTY=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Compare overlay files against origin/main to detect silent auto-merge drift.
          for f in wrangler.toml .github/workflows/deploy.yml; do
            remote_sha=$(git rev-parse "fork/main:${f}:${f}" 2>/dev/null || echo missing)
            local_sha=$(git hash-object "${f}")
            echo "${f}: remote=${remote_sha} local=${local_sha}"
            if [ "${remote_sha}" != "${local_sha}" ]; then
              echo "OVERLAY_DIRTY=${f}" >> $GITHUB_OUTPUT
              break
            fi
          done
          if [ -z "${OVERLAY_DIRTY:-}" ]; then
            echo "OVERLAY_DIRTY=no" >> $GITHUB_OUTPUT
          fi

      - name: Check if anything changed
        id: diff
        run: |
          set -e
          if [ "${{ steps.merge.outputs.MERGE_STATUS }}" = "conflict" ]; then
            echo "HAS_DIFF=yes" >> $GITHUB_OUTPUT
            echo "REASON=merge-conflict" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ steps.overlay.outputs.OVERLAY_DIRTY }}" != "no" ]; then
            echo "HAS_DIFF=yes" >> $GITHUB_OUTPUT
            echo "REASON=overlay-drift" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git diff --quiet fork/main HEAD; then
            echo "HAS_DIFF=no" >> $GITHUB_OUTPUT
            echo "REASON=no-upstream-changes" >> $GITHUB_OUTPUT
          else
            echo "HAS_DIFF=yes" >> $GITHUB_OUTPUT
            echo "REASON=upstream-changes" >> $GITHUB_OUTPUT
          fi

      - name: Push branch
        if: steps.diff.outputs.HAS_DIFF == 'yes' && (inputs.dry_run != 'true')
        run: |
          BRANCH="${{ steps.branch.outputs.BRANCH }}"
          git push --force-with-lease=main:fork/main fork "HEAD:refs/heads/${BRANCH}"

      - name: Open PR
        if: steps.diff.outputs.HAS_DIFF == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.branch.outputs.BRANCH }}';
            const reason = '${{ steps.diff.outputs.REASON }}';
            const mergeStatus = '${{ steps.merge.outputs.MERGE_STATUS }}';
            const overlayDirty = '${{ steps.overlay.outputs.OVERLAY_DIRTY }}';
            const dryRun = '${{ inputs.dry_run || '' }}' === 'true';
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(sync): upstream ${branch}`,
              head: branch,
              base: 'main',
              body: [
                '**Auto-generated by daily-upstream-sync**',
                '',
                `- Reason: ${reason}`,
                `- Merge status: ${mergeStatus}`,
                `- Overlay drift: ${overlayDirty}`,
                `- Dry run: ${dryRun}`,
                '',
                'Merge status and overlay drift determine whether auto-merge is safe.',
                'Always review the diff, especially `wrangler.toml` and `.github/workflows/deploy.yml`.'
              ].join('\n'),
              draft: true
            });
            console.log('opened PR', pr.data.number);

      - name: Dry-run report
        if: inputs.dry_run == 'true'
        run: |
          echo "Dry run only; no branch pushed, no PR opened."
          echo "REASON=${{ steps.diff.outputs.REASON }}"
          echo "MERGE=${{ steps.merge.outputs.MERGE_STATUS }}"
          echo "OVERLAY=${{ steps.overlay.outputs.OVERLAY_DIRTY }}"
